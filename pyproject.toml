[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luxanix"
version = "1.0.0"
description = "Luxanix Studio — AI-powered Raytracing, Video Cutter & Photorealistic Remaster for Simracing & Gaming"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "BuzziGHG" }
]
keywords = [
    "luxanix",
    "raytracing",
    "rtx",
    "simracing",
    "video-editor",
    "video-enhancement",
    "depth-anything",
    "global-illumination",
    "ssr",
    "rtao",
    "nvenc"
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "gradio>=4.20.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "timm>=0.9.12",
    "imageio>=2.33.0",
    "imageio-ffmpeg>=0.4.9",
    "tqdm>=4.66.0"
]

[project.urls]
Homepage = "https://github.com/BuzziGHG/Luxanix"
Repository = "https://github.com/BuzziGHG/Luxanix.git"
